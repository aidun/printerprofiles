# Druckerdefinitionen.
#
# machine_name : exakter Name des Bambu-Studio-Maschinenprofils. {n} wird durch
#                den Düsendurchmesser ersetzt.
# extruders    : Anzahl aktiver Extruder. Bestimmt die Arraylänge
#                extruderabhängiger Filamentwerte (zweiter Wert = "nil").
# flow_factor  : Skalierung des Volumenstroms gegenüber dem X1C-Basiswert.

[h2c]
label          = "Bambu Lab H2C"
machine_name   = "Bambu Lab H2C {n} nozzle"
tag            = "H2C"
extruders      = 2
extruder_variants = ["Direct Drive Standard", "Direct Drive High Flow"]
flow_factor    = 1.15
max_hotend     = 350
bauraum        = "350 × 320 × 325 mm"
kammer         = "aktiv beheizt"
besonderheit   = "Vortek-Werkzeugwechsler, zwei gleichzeitig aktive Düsen"
nozzles        = ["0.2", "0.4", "0.6"]

[x1c]
label          = "Bambu Lab X1 Carbon"
machine_name   = "Bambu Lab X1 Carbon {n} nozzle"
tag            = "X1C"
extruders      = 1
extruder_variants = ["Direct Drive Standard", "Direct Drive High Flow"]
flow_factor    = 1.00
max_hotend     = 300
bauraum        = "256 × 256 × 256 mm"
kammer         = "geschlossen, passiv"
besonderheit   = "Lidar-Flusskalibrierung, Hardened-Steel-Düse ab Werk"
nozzles        = ["0.2", "0.4", "0.6"]

[p1s]
label          = "Bambu Lab P1S"
machine_name   = "Bambu Lab P1S {n} nozzle"
tag            = "P1S"
extruders      = 1
extruder_variants = ["Direct Drive Standard", "Direct Drive High Flow"]
flow_factor    = 0.95
max_hotend     = 300
bauraum        = "256 × 256 × 256 mm"
kammer         = "geschlossen, passiv"
besonderheit   = "kein Lidar, Flusskalibrierung muss manuell erfolgen"
nozzles        = ["0.2", "0.4", "0.6"]

[a1]
label          = "Bambu Lab A1"
machine_name   = "Bambu Lab A1 {n} nozzle"
tag            = "A1"
extruders      = 1
extruder_variants = ["Direct Drive Standard"]
flow_factor    = 0.90
max_hotend     = 300
bauraum        = "256 × 256 × 256 mm"
kammer         = "offen"
besonderheit   = "Bettschubser, offener Aufbau — PETG unkritisch, Zugluft meiden"
nozzles        = ["0.2", "0.4", "0.6"]

[a1mini]
label          = "Bambu Lab A1 mini"
machine_name   = "Bambu Lab A1 mini {n} nozzle"
tag            = "A1M"
extruders      = 1
extruder_variants = ["Direct Drive Standard"]
flow_factor    = 0.85
max_hotend     = 300
bauraum        = "180 × 180 × 180 mm"
kammer         = "offen"
besonderheit   = "kleinster Bauraum, schwächstes Hotend — niedrigster Volumenstrom"
nozzles        = ["0.2", "0.4", "0.6"]
