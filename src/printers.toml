# Printer definitions.
#
# machine_name : exact name of the Bambu Studio machine profile. {n} is
#                replaced by the nozzle diameter.
# flow_factor  : volumetric flow scaling relative to the X1C baseline.

[h2c]
label        = "Bambu Lab H2C"
machine_name = "Bambu Lab H2C {n} nozzle"
tag          = "H2C"
flow_factor  = 1.15
max_hotend   = 350
nozzles      = ["0.2", "0.4", "0.6"]

[x1c]
label        = "Bambu Lab X1 Carbon"
machine_name = "Bambu Lab X1 Carbon {n} nozzle"
tag          = "X1C"
flow_factor  = 1.00
max_hotend   = 300
nozzles      = ["0.2", "0.4", "0.6"]

[p1s]
label        = "Bambu Lab P1S"
machine_name = "Bambu Lab P1S {n} nozzle"
tag          = "P1S"
flow_factor  = 0.95
max_hotend   = 300
nozzles      = ["0.2", "0.4", "0.6"]

[p1p]
label        = "Bambu Lab P1P"
machine_name = "Bambu Lab P1P {n} nozzle"
tag          = "P1P"
flow_factor  = 0.95
max_hotend   = 300
nozzles      = ["0.2", "0.4", "0.6"]

[a1]
label        = "Bambu Lab A1"
machine_name = "Bambu Lab A1 {n} nozzle"
tag          = "A1"
flow_factor  = 0.90
max_hotend   = 300
nozzles      = ["0.2", "0.4", "0.6"]

[a1mini]
label        = "Bambu Lab A1 mini"
machine_name = "Bambu Lab A1 mini {n} nozzle"
tag          = "A1M"
flow_factor  = 0.85
max_hotend   = 300
nozzles      = ["0.2", "0.4", "0.6"]
