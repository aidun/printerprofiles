id                           = "sunlu-tpu"
label                        = "SUNLU TPU"
order                        = 7
short                        = "TPU"
brand                        = "SUNLU"
material                     = "TPU"
base                         = "Generic TPU"
abrasive                     = false
hardened                     = false
transparent                  = false
flexible                     = true
status                       = "baseline"
drying                       = "50 °C / 8 h — TPU nimmt Feuchtigkeit schneller auf als jedes andere Material hier"
storage                      = "zwingend trocken, Silikagel; feuchtes TPU blubbert hörbar an der Düse"
nozzles                      = ["0.4", "0.6"]
description                  = "Flexibles Material, Shore 95A. Der begrenzende Faktor ist nicht die Düse, sondern der Extruder: weiches Filament knickt unter Vorschubdruck aus, statt zu fördern. Deshalb bleibt der Volumenstrom über alle Düsen gleich niedrig, und die 0.2-mm-Düse ist gesperrt — für sie liefert Bambu auf keinem Gerät ein TPU-Basisprofil."

[temperature]
nozzle                       = 225
nozzle_initial               = 230
range_low                    = 200
range_high                   = 245
vitrification                = 30
bed                          = 35
bed_initial                  = 40

[flow]
ratio                        = 1.0

# From 'Generic TPU' — Bambu ships no X1C-specific TPU profile, the X1C
# inherits the bare base. The curve is flat on purpose: a wider nozzle does
# not raise what the extruder can push through soft filament.
[volumetric_flow]
"0.4" = 3.2
"0.6" = 3.2

[cooling]
fan_min_speed                = 100
fan_max_speed                = 100
overhang_fan_speed           = 100
slow_down_layer_time         = 8
fan_cooling_layer_time       = 100
close_fan_the_first_x_layers = 1

[retraction]
z_hop                        = 0.4
