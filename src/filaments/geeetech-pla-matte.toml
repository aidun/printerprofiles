id                           = "geeetech-pla-matte"
label                        = "Geeetech PLA Matte"
order                        = 16
short                        = "PLA Matte"
brand                        = "Geeetech"
material                     = "PLA"
base                         = "Generic PLA"
abrasive                     = false
hardened                     = false
transparent                  = false
flexible                     = false
status                       = "baseline"
drying                       = "45 °C / 6 h"
storage                      = "trocken, Silikagel; ab Werk vakuumiert mit Trockenmittel"
nozzles                      = ["0.2", "0.4", "0.6"]
description                  = "Mineralisch gefülltes PLA mit matter, streulichtfreier Oberfläche. Die Füllung verbirgt Schichtlinien und Nahtstellen, verträgt dafür etwas weniger Hitze als ungefülltes PLA. Geeetech nennt 190 – 220 °C bei 50 – 70 °C Bett und eine Durchmessertoleranz von ±0.03 mm."

[temperature]
nozzle                       = 205
nozzle_initial               = 210
range_low                    = 190
range_high                   = 220
vitrification                = 60
bed                          = 55
bed_initial                  = 60

[flow]
ratio                        = 0.98

# Volumetric flow and flow ratio from 'Generic PLA @Geeetech' (12 mm³/s at
# 0.98); 0.2 mm from 'Generic PLA @0.2 nozzle' of the Bambu library. The
# mineral filler does not change the melt rate — it changes the surface.
[volumetric_flow]
"0.2" = 1.6
"0.4" = 12.0
"0.6" = 12.0

[cooling]
fan_min_speed                = 60
fan_max_speed                = 100
overhang_fan_speed           = 100
slow_down_layer_time         = 4
fan_cooling_layer_time       = 30
close_fan_the_first_x_layers = 1

[retraction]
z_hop                        = 0.4
