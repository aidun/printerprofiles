id                           = "esun-abs"
label                        = "eSUN ABS+"
order                        = 12
short                        = "ABS+"
brand                        = "eSUN"
material                     = "ABS"
base                         = "Generic ABS"
abrasive                     = false
hardened                     = false
transparent                  = false
flexible                     = false
status                       = "baseline"
drying                       = "70 °C / 4 h"
storage                      = "trocken, Silikagel; ABS ist weniger hygroskopisch als PETG"
nozzles                      = ["0.2", "0.4", "0.6"]
# No ABS base profile exists for the A1 mini in the Bambu library — its build
# volume and bed power do not carry the material.
printers                     = ["h2c", "x1c", "p1s", "p1p", "a1"]
description                  = "Schlagfestes, temperaturbeständiges ABS. Das einzige Material im Sortiment, das eine geschlossene Kammer braucht: ABS schrumpft beim Abkühlen und löst sich bei Zugluft von der Platte oder reißt zwischen den Schichten auf. Die Kühlung ist gegenüber dem Bambu-Basisprofil deutlich zurückgenommen — Schichthaftung geht hier vor Überhangqualität."

[temperature]
nozzle                       = 255
nozzle_initial               = 260
range_low                    = 240
range_high                   = 275
vitrification                = 100
bed                          = 90
bed_initial                  = 95

[flow]
ratio                        = 0.95

# 0.4/0.6 from 'Generic ABS', 0.2 from 'Generic ABS @0.2 nozzle' — Bambu ships
# no X1C-specific ABS profile, the X1C inherits the bare base. The fan settings
# below deviate from it deliberately (warping).
[volumetric_flow]
"0.2" = 2.0
"0.4" = 15.0
"0.6" = 15.0

[cooling]
fan_min_speed                = 10
fan_max_speed                = 30
overhang_fan_speed           = 60
slow_down_layer_time         = 5
fan_cooling_layer_time       = 30
close_fan_the_first_x_layers = 3

[retraction]
z_hop                        = 0.4
