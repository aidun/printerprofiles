material                     = "PLA"
base                         = "Bambu PLA Basic"
abrasive                     = false
hardened                     = false
transparent                  = false
flexible                     = false
status                       = "baseline"
drying                       = "45 °C / 6 h"
storage                      = "trocken; im AMS unkritisch"
nozzles                      = ["0.2", "0.4", "0.6"]
description                  = "Das Hausfilament. Erbt vom herstellereigenen Profil und übernimmt dessen Datenblattwerte — der höchste freigegebene Volumenstrom im Sortiment und der Maßstab, an dem die Drittanbieter gemessen werden."

[temperature]
nozzle                       = 220
nozzle_initial               = 225
range_low                    = 210
range_high                   = 230
